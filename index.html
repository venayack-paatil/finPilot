<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinPilot — Your Financial Decision Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F8FA;
  --surface:#FFFFFF;
  --ink:#0B1F3A;
  --ink-soft:#5B6B82;
  --ink-faint:#93A1B4;
  --line:#E4E9F0;
  --line-soft:#EEF2F6;
  --primary:#0E6E5B;
  --primary-dark:#0A5245;
  --primary-tint:#E4F3EF;
  --blue:#2E5AA8;
  --blue-tint:#E8EEF9;
  --amber:#A8702E;
  --amber-tint:#FBF1E4;
  --red:#B23B3B;
  --red-tint:#FBEBEB;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(11,31,58,0.04), 0 8px 24px -12px rgba(11,31,58,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--primary-tint);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:10px;border:1px solid transparent;
  font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink-soft);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:none;padding:8px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:8px 14px;font-size:13px;}
.btn-block{width:100%;}
.btn-danger{background:var(--red-tint);color:var(--red);}

/* ---------- Layout shell ---------- */
#app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.sidebar-logo{display:flex;align-items:center;gap:9px;padding:6px 10px 22px 10px;}
.sidebar-logo .mark{width:28px;height:28px;border-radius:8px;background:var(--primary);position:relative;flex-shrink:0;}
.sidebar-logo .mark:after{content:'';position:absolute;left:7px;top:14px;width:6px;height:9px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);}
.sidebar-logo span{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
.nav-group{margin-bottom:14px;}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);padding:14px 12px 6px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
  color:var(--ink-soft);font-size:14.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
  transition:background .12s ease,color .12s ease;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:var(--line-soft);color:var(--ink);}
.nav-item.active{background:var(--primary-tint);color:var(--primary-dark);}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;}
.sidebar-user:hover{background:var(--line-soft);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-tint);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.sidebar-user .who{display:flex;flex-direction:column;line-height:1.25;}
.sidebar-user .who b{font-size:13.5px;}
.sidebar-user .who small{font-size:11.5px;color:var(--ink-faint);}

.main{flex:1;min-width:0;}
.topbar{
  display:none;align-items:center;justify-content:space-between;padding:14px 18px;
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.page{padding:32px 40px 90px;max-width:1180px;}
.page-head{margin-bottom:26px;}
.page-head h1{font-size:26px;margin:0 0 6px;}
.page-head p{margin:0;color:var(--ink-soft);font-size:15px;}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;}
.card-soft{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:18px;}
.grid{display:grid;gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-2-1{grid-template-columns:2fr 1fr;}
@media(max-width:980px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(1,1fr);}
  .grid-2-1{grid-template-columns:1fr;}
}
.stat-card .label{font-size:13px;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.stat-card .value{font-size:24px;font-weight:700;font-family:'Space Grotesk';}
.stat-card .sub{font-size:12.5px;margin-top:6px;color:var(--ink-faint);}
.up{color:var(--primary);}
.down{color:var(--red);}
.section-title{font-size:15px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;justify-content:space-between;}
.section-sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;}
.pill-green{background:var(--primary-tint);color:var(--primary-dark);}
.pill-blue{background:var(--blue-tint);color:var(--blue);}
.pill-amber{background:var(--amber-tint);color:var(--amber);}
.pill-red{background:var(--red-tint);color:var(--red);}
hr.div{border:none;border-top:1px solid var(--line-soft);margin:18px 0;}

/* progress bars */
.bar-track{height:8px;border-radius:100px;background:var(--line-soft);overflow:hidden;}
.bar-fill{height:100%;border-radius:100px;background:var(--primary);}

/* forms */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.field .hint{font-size:12px;color:var(--ink-faint);margin-top:5px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14.5px;color:var(--ink);
  background:var(--surface);font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-tint);border-color:var(--primary);}
input[type=range]{width:100%;accent-color:var(--primary);height:4px;}
.input-prefix{position:relative;}
.input-prefix span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:14.5px;}
.input-prefix input{padding-left:28px;}

/* landing page */
.nav-public{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;max-width:1280px;margin:0 auto;}
.nav-public .links{display:flex;gap:28px;font-size:14.5px;font-weight:500;color:var(--ink-soft);}
.nav-public .links a{cursor:pointer;}
.hero{max-width:1280px;margin:0 auto;padding:64px 48px 40px;text-align:center;}
.hero h1{font-size:52px;line-height:1.08;margin:0 0 20px;max-width:820px;margin-left:auto;margin-right:auto;}
.hero p{font-size:18px;color:var(--ink-soft);max-width:620px;margin:0 auto 34px;line-height:1.55;}
.hero-ctas{display:flex;gap:14px;justify-content:center;margin-bottom:56px;}
.flow-strip{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 70px;}
.flow-node{background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:9px 20px;font-weight:600;font-size:14px;}
.flow-arrow{color:var(--ink-faint);font-size:16px;}
.benefits{max-width:1120px;margin:0 auto;padding:0 48px 80px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
@media(max-width:1000px){.benefits{grid-template-columns:repeat(2,1fr);} .hero h1{font-size:36px;}}
.benefit-card{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--surface);}
.benefit-card .ic{width:36px;height:36px;border-radius:9px;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--primary-dark);}
.benefit-card h4{margin:0 0 6px;font-size:15px;}
.benefit-card p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.preview-wrap{max-width:1040px;margin:0 auto 90px;padding:0 48px;}
.preview-frame{border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);padding:14px;}
.engine-section{background:var(--ink);color:#fff;padding:80px 48px;text-align:center;}
.engine-section h2{color:#fff;font-size:28px;margin:0 0 10px;}
.engine-section p{color:#9DAEC6;margin:0 0 40px;}
.engine-stack{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:0;}
.engine-input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 18px;font-size:13.5px;width:100%;text-align:center;margin-bottom:6px;}
.engine-plus{color:#5B7191;font-size:13px;margin-bottom:6px;}
.engine-arrow-big{color:#4C6488;font-size:22px;margin:14px 0;}
.engine-box{background:var(--primary);border-radius:12px;padding:18px 26px;font-weight:700;font-family:'Space Grotesk';font-size:15px;width:100%;}
.footer-public{border-top:1px solid var(--line);padding:36px 48px;text-align:center;color:var(--ink-faint);font-size:13px;}

/* auth pages */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:var(--shadow);}
.auth-card .logo{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:22px;}
.auth-card h2{text-align:center;font-size:22px;margin:0 0 6px;}
.auth-card .sub{text-align:center;color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}

/* brand lockup — logo image above the FinPilot name, tagline below (Landing / Login / Sign Up) */
.brand-lockup{display:flex;flex-direction:column;align-items:center;gap:0;}
.brand-lockup .brand-logo-img{display:block;width:60px;height:60px;object-fit:contain;margin-bottom:2px;}
.brand-lockup .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:19px;line-height:1.15;color:var(--ink);}
.brand-lockup .brand-tagline{font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:.01em;line-height:1.2;margin-top:3px;white-space:nowrap;}
.auth-card .brand-lockup{margin-bottom:20px;}
.nav-public .brand-lockup{align-items:flex-start;}
.nav-public .brand-lockup .brand-logo-img{width:40px;height:40px;margin-bottom:2px;}
.nav-public .brand-lockup .brand-name{font-size:16px;}
.nav-public .brand-lockup .brand-tagline{font-size:9px;white-space:nowrap;}
@media(max-width:520px){
  .auth-card .brand-lockup .brand-logo-img{width:48px;height:48px;}
  .nav-public .brand-lockup .brand-logo-img{width:32px;height:32px;}
  .nav-public .brand-lockup .brand-name{font-size:14px;}
  .nav-public .brand-lockup .brand-tagline{font-size:8px;}
}
.field-error{font-size:12.5px;color:var(--red);margin-top:5px;}
.field input.invalid{border-color:var(--red);}
.auth-banner{font-size:13px;color:var(--red);background:var(--red-tint);border-radius:10px;padding:10px 12px;margin-bottom:16px;text-align:center;}
.auth-switch{text-align:center;margin-top:18px;font-size:13.5px;color:var(--ink-soft);}
.auth-switch b{color:var(--primary);cursor:pointer;}

/* onboarding */
.onb-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:50px 20px;}
.onb-steps{display:flex;gap:8px;margin-bottom:34px;}
.onb-dot{width:34px;height:6px;border-radius:100px;background:var(--line);}
.onb-dot.done{background:var(--primary);}
.onb-dot.now{background:var(--primary-dark);}
.onb-card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:38px;box-shadow:var(--shadow);}
.onb-eyebrow{font-size:12.5px;color:var(--primary-dark);font-weight:600;margin-bottom:8px;}
.onb-card h2{font-size:22px;margin:0 0 8px;}
.onb-card p.desc{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}
.risk-option{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.risk-option.sel{border-color:var(--primary);background:var(--primary-tint);}
.risk-option b{font-size:14.5px;}
.risk-option span{font-size:12.5px;color:var(--ink-soft);}
.onb-nav{display:flex;justify-content:space-between;margin-top:28px;}

/* chart canvas wrap */
.chart-box{position:relative;height:230px;}
.chart-box.sm{height:170px;}

/* tables/lists */
.tx-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-soft);}
.tx-row:last-child{border-bottom:none;}
.tx-left{display:flex;align-items:center;gap:12px;}
.tx-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.tx-cat{font-size:14px;font-weight:600;}
.tx-date{font-size:12px;color:var(--ink-faint);}
.tx-amt{font-weight:700;font-family:'Space Grotesk';}

/* goal card */
.goal-card{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--surface);}
.goal-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.goal-card h4{margin:0 0 4px;font-size:16px;}
.goal-card .meta{font-size:12.5px;color:var(--ink-soft);}
.goal-amt-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--ink-soft);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,0.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:18px;padding:26px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
.modal h3{margin:0 0 4px;font-size:18px;}
.modal .close-x{position:absolute;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}

/* info icon + calculation detail popover */
.info-ic{
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-faint);font-size:14px;line-height:1;cursor:pointer;
  margin-left:6px;position:relative;flex-shrink:0;vertical-align:middle;
  transition:color .12s ease;
}
.info-ic:hover,.info-ic:focus{color:var(--primary-dark);outline:none;}
.info-ic .tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;
  padding:6px 10px;border-radius:7px;white-space:nowrap;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;z-index:40;
}
.info-ic .tip:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);}
.info-ic:hover .tip,.info-ic:focus .tip{opacity:1;visibility:visible;}
.calc-modal{max-width:400px;}
.calc-block{margin-bottom:16px;}
.calc-block:last-of-type{margin-bottom:0;}
.calc-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin-bottom:6px;}
.calc-text{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
.calc-inputs{display:flex;flex-direction:column;gap:6px;}
.calc-input-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 10px;background:var(--line-soft);border-radius:8px;}
.calc-input-row b{font-family:'Space Grotesk';font-weight:700;flex-shrink:0;}
.calc-formula{font-size:12.5px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;margin-bottom:6px;}
.calc-math{font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;}
.calc-result{background:var(--primary-tint);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.calc-result .calc-label{color:var(--primary-dark);}
.calc-result-value{font-family:'Space Grotesk';font-weight:700;font-size:22px;color:var(--primary-dark);}
.calc-assumption{font-size:12px;color:var(--amber);background:var(--amber-tint);border-radius:8px;padding:9px 11px;line-height:1.5;}
.calc-assumption b{font-weight:700;}
@media(max-width:520px){
  .calc-modal{max-width:100%;}
}

/* toggle switch used for allocation */
.alloc-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.alloc-label{width:158px;font-size:13.5px;font-weight:600;flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;}
.alloc-track{flex:1;height:10px;border-radius:100px;background:var(--line-soft);}
.alloc-val{width:82px;text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:14px;flex-shrink:0;}

/* learn */
.learn-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.learn-tab{padding:8px 15px;border-radius:100px;border:1px solid var(--line);font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.learn-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.lesson-card{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--surface);cursor:pointer;transition:border-color .12s;}
.lesson-card:hover{border-color:var(--primary);}
.lesson-card .diff{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:10px;}
.lesson-card h4{margin:0 0 8px;font-size:15.5px;}
.lesson-card .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--ink-faint);}

/* assistant */
.fab{
  position:fixed;bottom:26px;right:26px;background:var(--ink);color:#fff;border:none;border-radius:100px;
  padding:14px 20px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;cursor:pointer;
  box-shadow:0 10px 28px -8px rgba(11,31,58,0.45);z-index:60;
}
.assist-panel{
  position:fixed;bottom:96px;right:26px;width:360px;max-width:calc(100vw - 32px);background:var(--surface);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);z-index:61;display:flex;flex-direction:column;
  max-height:520px;
}
.assist-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;}
.assist-head b{font-size:14.5px;}
.assist-body{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;min-height:220px;}
.msg{max-width:85%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;}
.msg.bot{background:var(--line-soft);align-self:flex-start;border-bottom-left-radius:3px;}
.msg.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.assist-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.assist-foot{padding:12px;border-top:1px solid var(--line-soft);display:flex;gap:8px;}
.assist-foot input{flex:1;}
.quick-q{font-size:12px;padding:6px 11px;border-radius:100px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-soft);}

/* preset scenario chips */
.chip-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;}
.chip{padding:9px 14px;border-radius:100px;border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);}
.chip:hover{border-color:var(--primary);color:var(--primary-dark);}

/* recommendation card */
.rec-card{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;}
.rec-num{width:24px;height:24px;border-radius:7px;background:var(--primary-tint);color:var(--primary-dark);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rec-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.rec-detail{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:12.5px;margin-top:10px;}
.rec-detail div b{display:block;color:var(--ink-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
@media(max-width:700px){.rec-detail{grid-template-columns:1fr;}}

/* responsive sidebar */
@media(max-width:880px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  .page{padding:22px 18px 90px;}
  .hero h1{font-size:30px;}
  .nav-public .links{display:none;}
}
.mobile-nav{position:fixed;inset:0;background:#fff;z-index:80;padding:20px;overflow-y:auto;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:34px;margin-bottom:12px;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:var(--shadow);}
</style>

function fmt(n){
  n = Math.round(n);
  const sign = n<0?'-':'';
  n = Math.abs(n);
  return sign + '₹' + n.toLocaleString('en-IN');
}
function fmtShort(n){
  if(n>=10000000) return '₹'+(n/10000000).toFixed(2)+'Cr';
  if(n>=100000) return '₹'+(n/100000).toFixed(1)+'L';
  if(n>=1000) return '₹'+(n/1000).toFixed(1)+'k';
  return fmt(n);
}
function greeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Good night';
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  if(h < 21) return 'Good evening';
  return 'Good night';
}

const LS_USERDATA = 'finpilot_userdata';

function getAccount(){
  try{ return JSON.parse(localStorage.getItem(LS_ACCOUNT)); }catch(e){ return null; }
}
function saveAccount(acc){
  try{ localStorage.setItem(LS_ACCOUNT, JSON.stringify(acc)); }catch(e){}
}
function getSession(){
  try{ return JSON.parse(localStorage.getItem(LS_SESSION)); }catch(e){ return null; }
}
function saveSession(email){
  try{ localStorage.setItem(LS_SESSION, JSON.stringify({email, ts:Date.now()})); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(LS_SESSION); }catch(e){}
}
function saveUserData(){
  try{
    localStorage.setItem(LS_USERDATA, JSON.stringify({
      onboarded: state.onboarded,
      user: state.user,
      expenses: state.expenses,
      goals: state.goals,
      sim: state.sim,
      expenseIdSeq, goalIdSeq,
    }));
  }catch(e){}
}
function loadUserData(){
  try{ return JSON.parse(localStorage.getItem(LS_USERDATA)); }catch(e){ return null; }
}
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}
function isProtectedRoute(route){
  return route==='onboarding' || !!APP_PAGES[route];
}

/* Restores an active session (if any) on load / bfcache restore. */
function initAuth(){
  const session = getSession();
  const account = getAccount();
  if(session && account && session.email===account.email){
    state.authed = true;
    const data = loadUserData();
    if(data){
      state.onboarded = !!data.onboarded;
      if(data.user) Object.assign(state.user, data.user);
      if(data.expenses) state.expenses = data.expenses;
      if(data.goals) state.goals = data.goals;
      if(data.sim) Object.assign(state.sim, data.sim);
      if(data.expenseIdSeq) expenseIdSeq = data.expenseIdSeq;
      if(data.goalIdSeq) goalIdSeq = data.goalIdSeq;
    }
    state.route = state.onboarded ? 'dashboard' : 'onboarding';
  } else {
    state.authed = false;
    state.route = 'landing';
  }
}

function doSignup(){
  const nameEl = document.getElementById('su-name');
  const emailEl = document.getElementById('su-email');
  const passEl = document.getElementById('su-password');
  const name = nameEl.value.trim();
  const email = emailEl.value.trim().toLowerCase();
  const password = passEl.value;

  [nameEl, emailEl, passEl].forEach(el=>el.classList.remove('invalid'));
  let errors = {};
  if(!name) errors.name = 'Please enter your name.';
  if(!email) errors.email = 'Please enter your email.';
  else if(!isValidEmail(email)) errors.email = 'Please enter a valid email address.';
  if(!password) errors.password = 'Please enter a password.';
  else if(password.length<6) errors.password = 'Password must be at least 6 characters.';

  const existing = getAccount();
  if(!errors.email && existing && existing.email===email){
    errors.email = 'An account with this email already exists.';
  }

  if(Object.keys(errors).length){
    if(errors.name) nameEl.classList.add('invalid');
    if(errors.email) emailEl.classList.add('invalid');
    if(errors.password) passEl.classList.add('invalid');
    state._signupErrors = errors;
    render();
    return;
  }

  saveAccount({name, email, password, createdAt:Date.now()});
  saveSession(email);
  // Fresh account: reset financial data to defaults and clear any old snapshot.
  state.onboarded = false;
  state.user.name = name;
  localStorage.removeItem(LS_USERDATA);
  state.authed = true;
  state._signupErrors = null;
  nav('onboarding');
}

function doLogin(){
  const emailEl = document.getElementById('li-email');
  const passEl = document.getElementById('li-password');
  const email = emailEl.value.trim().toLowerCase();
  const password = passEl.value;

  [emailEl, passEl].forEach(el=>el.classList.remove('invalid'));
  let errors = {};
  if(!email) errors.email = 'Please enter your email.';
  if(!password) errors.password = 'Please enter your password.';

  if(Object.keys(errors).length){
    if(errors.email) emailEl.classList.add('invalid');
    if(errors.password) passEl.classList.add('invalid');
    state._loginErrors = errors;
    state._loginGeneralError = null;
    render();
    return;
  }

  const account = getAccount();
  if(!account || account.email!==email || account.password!==password){
    emailEl.classList.add('invalid');
    passEl.classList.add('invalid');
    state._loginErrors = null;
    state._loginGeneralError = 'Invalid email or password.';
    render();
    return;
  }

  saveSession(email);
  const data = loadUserData();
  state.authed = true;
  state.onboarded = !!(data && data.onboarded);
  if(data){
    if(data.user) Object.assign(state.user, data.user);
    if(data.expenses) state.expenses = data.expenses;
    if(data.goals) state.goals = data.goals;
    if(data.sim) Object.assign(state.sim, data.sim);
    if(data.expenseIdSeq) expenseIdSeq = data.expenseIdSeq;
    if(data.goalIdSeq) goalIdSeq = data.goalIdSeq;
  }
  state.user.name = account.name;
  state._loginErrors = null;
  state._loginGeneralError = null;
  nav(state.onboarded ? 'dashboard' : 'onboarding');
}

function doLogout(){
  clearSession();
  state.authed = false;
  nav('login');
  setToast('Logged out successfully.');
}

function nav(route){
  if(isProtectedRoute(route) && !state.authed){
    route = 'login';
  }
  if(route==='signup') state._signupErrors = null;
  if(route==='login'){ state._loginErrors = null; state._loginGeneralError = null; }
  state.route = route;
  state.mobileNavOpen = false;
  window.scrollTo(0,0);
  render();
}
function setToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 2600);
}

/* ---------- financial calculations ---------- */
function sipFutureValue(monthly, years, annualRatePct){
  const r = annualRatePct/100/12;
  const n = years*12;
  if(r===0) return monthly*n;
  return monthly * ( (Math.pow(1+r,n)-1)/r ) * (1+r);
}
function requiredSip(target, years, annualRatePct, lumpsum){
  const r = annualRatePct/100/12;
  const n = years*12;
  const fvLump = lumpsum * Math.pow(1+r/1,n); // approx monthly compounding
  const remaining = Math.max(target - fvLump, 0);
  if(r===0) return remaining/n;
  const factor = ( (Math.pow(1+r,n)-1)/r ) * (1+r);
  return remaining/factor;
}
function healthScore(u){
  const savingsRate = (u.income - u.essential - u.discretionary)/u.income;
  let score = 50;
  score += Math.min(savingsRate*100, 30);
  score += u.investment>0 ? 12 : 0;
  score += u.emergency>=u.essential*0.15 ? 8 : 0;
  return Math.max(0, Math.min(100, Math.round(score)));
}

}
function openCalcInfo(key){ state.modal = {type:'calc-info', key}; render(); }
function closeCalcInfo(){ state.modal = null; render(); }

function calcInfoData(key){
  const u = state.user;
  const income = u.income, expenses = u.essential+u.discretionary, savings = income-expenses;

  if(key==='dash-income'){
    return { title:'Monthly Income',
      meaning:'Your total monthly take-home income, entered in your profile. It\'s the base every other number in FinPilot is calculated from.',
      inputs:[{label:'Monthly Income', value:fmt(u.income)}],
      formula:'Direct input — not calculated',
      calc:`Monthly Income = ${fmt(u.income)}`,
      result:fmt(u.income) };
  }
  if(key==='dash-expenses'){
    return { title:'Monthly Expenses',
      meaning:'Your total monthly spending — essential costs plus discretionary spending, as set in your Budget.',
      inputs:[{label:'Essential Expenses', value:fmt(u.essential)},{label:'Discretionary Spending', value:fmt(u.discretionary)}],
      formula:'Essential Expenses + Discretionary Spending',
      calc:`${fmt(u.essential)} + ${fmt(u.discretionary)} = ${fmt(expenses)}`,
      result:fmt(expenses) };
  }
  if(key==='dash-savings'){
    return { title:'Monthly Savings',
      meaning:'What\'s left over each month after all your expenses are paid.',
      inputs:[{label:'Monthly Income', value:fmt(income)},{label:'Monthly Expenses', value:fmt(expenses)}],
      formula:'Income − Expenses',
      calc:`${fmt(income)} − ${fmt(expenses)} = ${fmt(savings)}`,
      result:fmt(savings) };
  }
  if(key==='dash-investments'){
    return { title:'Investments',
      meaning:'The amount you\'ve allocated to invest each month, as set in your Budget.',
      inputs:[{label:'Monthly Investment Allocation', value:fmt(u.investment)}],
      formula:'Direct input from your Budget allocation',
      calc:`Monthly Investment = ${fmt(u.investment)}`,
      result:fmt(u.investment)+'/mo' };
  }
  if(key==='dash-health'){
    const savingsRate = (u.income-u.essential-u.discretionary)/u.income;
    const srPoints = Math.max(0, Math.min(Math.round(savingsRate*100), 30));
    const investPoints = u.investment>0?12:0;
    const ep = u.emergency>=u.essential*0.15?8:0;
    const score = healthScore(u);
    let opportunity;
    if(investPoints<12) opportunity = 'Start a monthly investment — this alone adds 12 points.';
    else if(ep<8) opportunity = 'Build your emergency savings to at least 15% of essential expenses.';
    else if(srPoints<30) opportunity = 'Increase your savings rate to add more points.';
    else opportunity = 'Keep up your current habits — all three factors are in good shape.';
    return { title:'Financial Health Score',
      meaning:'A 0–100 score reflecting how healthy your monthly finances are, based on three factors: your savings rate, whether you invest consistently, and your emergency fund coverage.',
      inputs:[
        {label:'Savings Rate', value:Math.round(savingsRate*100)+'%'},
        {label:'Investment Discipline', value:u.investment>0?'Investing '+fmt(u.investment)+'/mo':'Not investing'},
        {label:'Emergency Savings', value:fmt(u.emergency)+' ('+Math.round(u.emergency/u.essential*100)+'% of essentials)'},
      ],
      formula:'50 base + up to 30 (savings rate) + 12 (investing) + 8 (emergency fund ≥ 15% of essentials)',
      calc:`50 + ${srPoints} + ${investPoints} + ${ep} = ${score}`,
      result:score+'/100',
      assumption:'Biggest opportunity: '+opportunity };
  }
  if(key==='dash-spend-breakdown'){
    const byCat={}; state.expenses.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+e.amt;});
    const cats = Object.keys(byCat);
    const total = cats.reduce((s,c)=>s+byCat[c],0);
    return { title:'Spending Breakdown',
      meaning:'How your recorded transactions this month split across categories.',
      inputs:cats.map(c=>({label:c, value:fmt(byCat[c])})),
      formula:'Sum of transaction amounts, grouped by category',
      calc:cats.map(c=>fmt(byCat[c])).join(' + ')+` = ${fmt(total)}`,
      result:fmt(total)+' total' };
  }
  if(key==='dash-goal-progress'){
    const goal = state.goals[0];
    const pct = Math.min(100, Math.round(goal.saved/goal.amount*100));
    return { title:'Goal Progress',
      meaning:`How far you are toward your "${goal.name}" goal.`,
      inputs:[{label:'Saved So Far', value:fmt(goal.saved)},{label:'Goal Target', value:fmt(goal.amount)}],
      formula:'Saved ÷ Target × 100',
      calc:`${fmt(goal.saved)} ÷ ${fmt(goal.amount)} × 100 = ${pct}%`,
      result:pct+'%' };
  }

  /* ---------- Budget ---------- */
  if(key.startsWith('budget-')){
    const optimized = state._budgetOptimized;
    const disc = optimized?10000:u.discretionary;
    const inv = optimized?10000:u.investment;
    const remaining = u.income-u.essential-disc-u.emergency-inv;
    if(key==='budget-essential'){
      return { title:'Essential Expenses',
        meaning:'Non-negotiable monthly costs like rent, groceries, utilities, and bills.',
        inputs:[{label:'Essential Expenses', value:fmt(u.essential)}],
        formula:'Direct input from your profile/budget',
        calc:`Essential Expenses = ${fmt(u.essential)}`,
        result:fmt(u.essential) };
    }
    if(key==='budget-discretionary'){
      return { title:'Discretionary Spending',
        meaning:'Flexible spending on non-essentials — shopping, entertainment, dining out.',
        inputs:[{label:'Discretionary Spending', value:fmt(disc)}],
        formula: optimized? 'Set by FinPilot\'s budget optimization' : 'Direct input from your profile/budget',
        calc:`Discretionary Spending = ${fmt(disc)}`,
        result:fmt(disc),
        assumption: optimized? 'This value was adjusted when you optimized your budget.' : undefined };
    }
    if(key==='budget-emergency'){
      return { title:'Emergency Savings',
        meaning:'Money set aside each month to build a safety net for unexpected expenses.',
        inputs:[{label:'Emergency Savings', value:fmt(u.emergency)}],
        formula:'Direct input from your profile/budget',
        calc:`Emergency Savings = ${fmt(u.emergency)}`,
        result:fmt(u.emergency) };
    }
    if(key==='budget-investments'){
      return { title:'Investments',
        meaning:'The portion of your income allocated to monthly investing (SIP).',
        inputs:[{label:'Monthly Investment', value:fmt(inv)}],
        formula: optimized? 'Set by FinPilot\'s budget optimization' : 'Direct input from your profile/budget',
        calc:`Investments = ${fmt(inv)}`,
        result:fmt(inv),
        assumption: optimized? 'This value was adjusted when you optimized your budget.' : undefined };
    }
    if(key==='budget-remaining'){
      return { title:'Remaining',
        meaning:'Whatever is left over in your monthly income after essentials, discretionary spending, emergency savings, and investments are accounted for.',
        inputs:[{label:'Monthly Income',value:fmt(u.income)},{label:'Essential',value:fmt(u.essential)},{label:'Discretionary',value:fmt(disc)},{label:'Emergency Savings',value:fmt(u.emergency)},{label:'Investments',value:fmt(inv)}],
        formula:'Income − Essential − Discretionary − Emergency Savings − Investments',
        calc:`${fmt(u.income)} − ${fmt(u.essential)} − ${fmt(disc)} − ${fmt(u.emergency)} − ${fmt(inv)} = ${fmt(remaining)}`,
        result:fmt(remaining) };
    }
    if(key==='budget-optimized'){
      return { title:'Optimized Budget',
        meaning:'FinPilot suggests rebalancing discretionary spending and investments to help you reach your goals faster, without touching your essentials or emergency savings.',
        inputs:[{label:'Discretionary (before)',value:'₹12,000'},{label:'Discretionary (after)',value:'₹10,000'},{label:'Investment (before)',value:'₹8,000'},{label:'Investment (after)',value:'₹10,000'}],
        formula:'Shifts ₹2,000/month from discretionary spending into investments',
        calc:'₹12,000 → ₹10,000 discretionary; ₹8,000 → ₹10,000 investment',
        result:'₹2,000/month redirected to investing',
        assumption:'This is an illustrative rebalancing suggestion, not a guaranteed outcome.' };
    }
  }

  /* ---------- Goals (uses the goal currently open in detail view) ---------- */
  if(key.startsWith('goal-')){
    const g = state.goals.find(x=>x.id===state._goalDetail) || state.goals[0];
    const rate = g.risk==='Conservative'?7:g.risk==='Moderate'?10:13;
    const monthsLeft = g.years*12;
    const reqSip = Math.round(requiredSip(g.amount, g.years, rate, g.saved));
    const projected = Math.round(sipFutureValue(reqSip, g.years, rate) + g.saved*Math.pow(1+rate/1200, monthsLeft));
    const shortfall = Math.max(0, g.amount-projected);
    const pct = Math.round(g.saved/g.amount*100);
    if(key==='goal-reqsip'){
      return { title:'Required Monthly Contribution',
        meaning:`The monthly amount you need to invest to reach your "${g.name}" goal on time, given your existing savings and risk profile.`,
        inputs:[{label:'Target', value:fmt(g.amount)},{label:'Existing Savings', value:fmt(g.saved)},{label:'Timeline', value:g.years+' years'},{label:'Expected Return', value:rate+'% p.a.'}],
        formula:'Solved from the future-value-of-SIP formula for the monthly contribution',
        calc:`Amount needed monthly to reach ${fmt(g.amount)} in ${g.years} years at ${rate}%, starting from ${fmt(g.saved)}`,
        result:fmt(reqSip)+'/mo',
        assumption:`Assumes a constant ${rate}% annual return, compounded monthly, based on your "${g.risk}" risk profile.` };
    }
    if(key==='goal-projected'){
      return { title:'Projected Value',
        meaning:'What your goal savings are projected to be worth at the end of your timeline if you invest the required monthly contribution.',
        inputs:[{label:'Monthly Contribution', value:fmt(reqSip)},{label:'Timeline', value:g.years+' years'},{label:'Expected Return', value:rate+'% p.a.'},{label:'Existing Savings', value:fmt(g.saved)}],
        formula:'Future value of monthly SIP + growth of existing savings',
        calc:`FV(${fmt(reqSip)}/mo, ${g.years} yrs, ${rate}%) + growth of ${fmt(g.saved)} = ${fmtShort(projected)}`,
        result:fmtShort(projected),
        assumption:'Illustrative projection — actual returns may vary.' };
    }
    if(key==='goal-progress'){
      return { title:'Current Progress',
        meaning:`How much of your "${g.name}" goal you've already saved.`,
        inputs:[{label:'Saved So Far', value:fmt(g.saved)},{label:'Goal Target', value:fmt(g.amount)}],
        formula:'Saved ÷ Target × 100',
        calc:`${fmt(g.saved)} ÷ ${fmt(g.amount)} × 100 = ${pct}%`,
        result:pct+'%' };
    }
    if(key==='goal-shortfall'){
      return { title:'Potential Shortfall',
        meaning:'The gap between your projected value and your goal target, if any.',
        inputs:[{label:'Goal Target', value:fmt(g.amount)},{label:'Projected Value', value:fmtShort(projected)}],
        formula:'max(Target − Projected Value, 0)',
        calc:`max(${fmt(g.amount)} − ${fmtShort(projected)}, 0) = ${shortfall>0?fmtShort(shortfall):'₹0'}`,
        result:shortfall>0?fmtShort(shortfall):'None',
        assumption:'Based on the same return assumption as your projection above.' };
    }
  }

  /* ---------- Investments page (uses primary goal, fixed 10% assumption) ---------- */
  if(key.startsWith('inv-')){
    const g = state.goals[0]; const rate = 10;
    const reqSip = Math.round(requiredSip(g.amount, g.years, rate, g.saved));
    const projected = Math.round(sipFutureValue(reqSip, g.years, rate) + g.saved);
    const shortfall = Math.max(0, g.amount-projected);
    if(key==='inv-sip'){
      return { title:'Monthly SIP',
        meaning:'The monthly investment amount recommended to reach your goal on time.',
        inputs:[{label:'Goal Target', value:fmt(g.amount)},{label:'Existing Savings', value:fmt(g.saved)},{label:'Timeline', value:g.years+' years'},{label:'Expected Return', value:rate+'% p.a.'}],
        formula:'Solved from the future-value-of-SIP formula for the monthly contribution',
        calc:`Amount needed monthly to reach ${fmt(g.amount)} in ${g.years} years at ${rate}%, starting from ${fmt(g.saved)}`,
        result:fmt(reqSip)+'/mo' };
    }
    if(key==='inv-return'){
      return { title:'Expected Return',
        meaning:'The annual growth rate assumed for this projection, based on a moderate-risk investment mix.',
        inputs:[{label:'Risk Profile', value:u.risk||'Moderate'},{label:'Assumed Annual Return', value:rate+'%'}],
        formula:'Fixed assumption used for illustrative projections',
        calc:`Expected Return = ${rate}% per year`,
        result:rate+'% p.a.',
        assumption:'This is an assumption, not a guaranteed or historical return.' };
    }
    if(key==='inv-projected'){
      return { title:'Projected Value',
        meaning:'What your SIP is projected to grow into by the end of your goal timeline.',
        inputs:[{label:'Monthly SIP', value:fmt(reqSip)},{label:'Timeline', value:g.years+' years'},{label:'Expected Return', value:rate+'% p.a.'},{label:'Existing Savings', value:fmt(g.saved)}],
        formula:'Future value of monthly SIP + existing savings',
        calc:`FV(${fmt(reqSip)}/mo, ${g.years} yrs, ${rate}%) + ${fmt(g.saved)} = ${fmtShort(projected)}`,
        result:fmtShort(projected),
        assumption:'Illustrative projection — actual returns may vary.' };
    }
    if(key==='inv-shortfall'){
      return { title:'Potential Shortfall',
        meaning:'The gap between your projected value and your goal target, if any.',
        inputs:[{label:'Goal Target', value:fmt(g.amount)},{label:'Projected Value', value:fmtShort(projected)}],
        formula:'max(Target − Projected Value, 0)',
        calc:`max(${fmt(g.amount)} − ${fmtShort(projected)}, 0) = ${shortfall>0?fmtShort(shortfall):'₹0'}`,
        result:shortfall>0?fmtShort(shortfall):'None',
        assumption:'Based on the same return assumption as your projection above.' };
    }
  }

  /* ---------- Simulator (live scenario values) ---------- */
  if(key.startsWith('sim-')){
    const s = state.sim; const rate = 10;
    const surplus = s.income - s.expenses;
    const projected = Math.round(sipFutureValue(s.sip, s.years, rate));
    const target = state.goals[0].amount;
    const coverage = Math.max(5, Math.min(97, Math.round((projected/target)*80 + (surplus>10000?10:0))));
    const yearsToGoal = (Math.log((target*(rate/1200))/s.sip + 1) / Math.log(1+rate/1200) / 12).toFixed(1);
    if(key==='sim-surplus'){
      return { title:'Monthly Surplus',
        meaning:'The money left over each month in this scenario, after expenses.',
        inputs:[{label:'Monthly Income', value:fmt(s.income)},{label:'Monthly Expenses', value:fmt(s.expenses)}],
        formula:'Income − Expenses',
        calc:`${fmt(s.income)} − ${fmt(s.expenses)} = ${fmt(surplus)}`,
        result:fmt(surplus) };
    }
    if(key==='sim-projected'){
      return { title:'Projected Goal Value',
        meaning:'What your monthly SIP under this scenario is projected to grow into by the end of the timeline.',
        inputs:[{label:'Monthly SIP', value:fmt(s.sip)},{label:'Timeline', value:s.years+' years'},{label:'Expected Return', value:rate+'% p.a.'}],
        formula:'Future value of a monthly SIP',
        calc:`FV(${fmt(s.sip)}/mo, ${s.years} yrs, ${rate}%) = ${fmtShort(projected)}`,
        result:fmtShort(projected),
        assumption:'Illustrative projection — actual returns may vary.' };
    }
    if(key==='sim-completion'){
      return { title:'Goal Completion',
        meaning:'Roughly how many years it would take this scenario\'s SIP to reach your goal target at the assumed return.',
        inputs:[{label:'Monthly SIP', value:fmt(s.sip)},{label:'Goal Target', value:fmt(target)},{label:'Expected Return', value:rate+'% p.a.'}],
        formula:'Solved from the future-value-of-SIP formula for time',
        calc:`Time to reach ${fmt(target)} at ${fmt(s.sip)}/mo, ${rate}% ≈ ${isFinite(yearsToGoal)?yearsToGoal:'—'} years`,
        result:(isFinite(yearsToGoal)?yearsToGoal:'—')+' yrs',
        assumption:'Illustrative estimate — actual timeline may vary.' };
    }
    if(key==='sim-coverage'){
      return { title:'Projected Goal Coverage',
        meaning:'An illustrative estimate of how well this scenario covers your goal — not a statistical probability. It blends your projected value against your goal target with a small bonus for a healthy monthly surplus.',
        inputs:[{label:'Projected Value', value:fmtShort(projected)},{label:'Goal Target', value:fmt(target)},{label:'Monthly Surplus', value:fmt(surplus)}],
        formula:'(Projected Value ÷ Goal Target × 80) + (10 if surplus > ₹10,000), capped between 5–97',
        calc:`(${fmtShort(projected)} ÷ ${fmt(target)} × 80) + ${surplus>10000?10:0} = ${coverage}%`,
        result:coverage+'%',
        assumption:'This is an illustrative prototype metric, not a statistical probability.' };
    }
  }

  return { title:'Calculation', meaning:'', inputs:[], formula:'', calc:'', result:'' };
}

/* ============================================================
   ONBOARDING
   ============================================================ */
const ONB_TOTAL = 6;
function onboardingPage(){
  const step = state.onbStep;
  const d = state.onbData;
  const dots = Array.from({length:ONB_TOTAL},(_,i)=>{
    const n=i+1;
    return `<div class="onb-dot ${n<step?'done':n===step?'now':''}"></div>`;
  }).join('');

  let body='';
  if(step===1){
    body = `<div class="onb-eyebrow">Step 1 of ${ONB_TOTAL}</div><h2>What's your monthly income?</h2><p class="desc">This is the foundation everything else is calculated from.</p>
    <div class="field"><label>Monthly Income</label><div class="input-prefix"><span>₹</span><input type="number" id="onb-income" value="${d.income}"></div></div>`;
  } else if(step===2){
    body = `<div class="onb-eyebrow">Step 2 of ${ONB_TOTAL}</div><h2>How much have you already saved?</h2><p class="desc">Include savings accounts and fixed deposits.</p>
    <div class="field"><label>Current Savings</label><div class="input-prefix"><span>₹</span><input type="number" id="onb-savings" value="${d.savings}"></div></div>`;
  } else if(step===3){
    body = `<div class="onb-eyebrow">Step 3 of ${ONB_TOTAL}</div><h2>What do you spend each month?</h2><p class="desc">Split it into essentials and everything else.</p>
    <div class="field"><label>Essential Expenses</label><div class="input-prefix"><span>₹</span><input type="number" id="onb-essential" value="${d.essential}"></div><div class="hint">Rent, groceries, bills, transport.</div></div>
    <div class="field"><label>Discretionary Expenses</label><div class="input-prefix"><span>₹</span><input type="number" id="onb-discretionary" value="${d.discretionary}"></div><div class="hint">Dining out, shopping, entertainment.</div></div>`;
  } else if(step===4){
    body = `<div class="onb-eyebrow">Step 4 of ${ONB_TOTAL}</div><h2>Any existing investments?</h2><p class="desc">Mutual funds, SIPs, stocks — a rough total is fine.</p>
    <div class="field"><label>Existing Investments</label><div class="input-prefix"><span>₹</span><input type="number" id="onb-invest" value="${d.investExisting}"></div></div>`;
  } else if(step===5){
    const risks=[
      {k:'Conservative', d:'Prioritize protecting your money over growth.'},
      {k:'Moderate', d:'Balance steady growth with manageable risk.'},
      {k:'Aggressive', d:'Prioritize long-term growth, accept more ups and downs.'},
    ];
    body = `<div class="onb-eyebrow">Step 5 of ${ONB_TOTAL}</div><h2>How do you feel about risk?</h2><p class="desc">This shapes how FinPilot models your investment growth.</p>
    ${risks.map(r=>`<div class="risk-option ${d.risk===r.k?'sel':''}" onclick="setOnbRisk('${r.k}')"><div><b>${r.k}</b><br><span>${r.d}</span></div>${d.risk===r.k?'✓':''}</div>`).join('')}`;
  } else if(step===6){
    body = `<div class="onb-eyebrow">Step 6 of ${ONB_TOTAL}</div><h2>What's your main financial goal?</h2><p class="desc">FinPilot will build your plan around this.</p>
    <div class="field"><label>Goal description</label><input type="text" id="onb-goalname" value="${d.goalName}"></div>
    <div class="field"><label>Target Amount</label><div class="input-prefix"><span>₹</span><input type="number" id="onb-goalamt" value="${d.goalAmount}"></div></div>
    <div class="field"><label>Timeline (years)</label><input type="number" id="onb-goalyears" value="${d.goalYears}"></div>`;
  }

  const isLast = step===ONB_TOTAL;
  return `<div class="onb-wrap">
    <div class="onb-steps">${dots}</div>
    <div class="onb-card">
      ${body}
      <div class="onb-nav">
        ${step>1?`<button class="btn btn-outline" onclick="onbBack()">Back</button>`:'<span></span>'}
        <button class="btn btn-primary" onclick="${isLast?'finishOnboarding()':'onbNext()'}">${isLast?'Generate My Financial Plan':'Continue'}</button>
      </div>
    </div>
  </div>`;
}
function setOnbRisk(k){ state.onbData.risk=k; render(); }
function readOnbInputs(){
  const d = state.onbData;
  const get = id => document.getElementById(id);
  if(get('onb-income')) d.income = Number(get('onb-income').value)||d.income;
  if(get('onb-savings')) d.savings = Number(get('onb-savings').value)||d.savings;
  if(get('onb-essential')) d.essential = Number(get('onb-essential').value)||d.essential;
  if(get('onb-discretionary')) d.discretionary = Number(get('onb-discretionary').value)||d.discretionary;
  if(get('onb-invest')) d.investExisting = Number(get('onb-invest').value)||d.investExisting;
  if(get('onb-goalname')) d.goalName = get('onb-goalname').value||d.goalName;
  if(get('onb-goalamt')) d.goalAmount = Number(get('onb-goalamt').value)||d.goalAmount;
  if(get('onb-goalyears')) d.goalYears = Number(get('onb-goalyears').value)||d.goalYears;
}
function onbNext(){ readOnbInputs(); state.onbStep = Math.min(ONB_TOTAL, state.onbStep+1); render(); }
function onbBack(){ readOnbInputs(); state.onbStep = Math.max(1, state.onbStep-1); render(); }
function finishOnboarding(){
  readOnbInputs();
  const d = state.onbData;
  const u = state.user;
  u.income=d.income; u.savings=d.savings; u.essential=d.essential; u.discretionary=d.discretionary;
  u.investExisting=d.investExisting; u.risk=d.risk;
  u.emergency = Math.round(d.income*0.083);
  u.investment = Math.round((d.income-d.essential-d.discretionary)*0.66);
  state.goals[0].amount = d.goalAmount; state.goals[0].years = d.goalYears; state.goals[0].name = 'Primary Goal';
  state.sim.income=u.income; state.sim.expenses=u.essential+u.discretionary; state.sim.sip=u.investment; state.sim.years=d.goalYears;
  state.onboarded = true;
  saveUserData();
  nav('dashboard');
}

function openExpenseModal(editId){
  const editing = editId? state.expenses.find(e=>e.id===editId) : null;
  state.modal = {
    type:'expense',
    editId: editId||null,
    title: editing? 'Edit Expense' : 'Add Expense',
  };
  render();
  setTimeout(()=>{
    if(editing){
      document.getElementById('m-amt').value = editing.amt;
      document.getElementById('m-cat').value = editing.cat;
      document.getElementById('m-date').value = editing.date;
      document.getElementById('m-desc').value = editing.desc;
    }
  },0);
}
function editExpense(id){ openExpenseModal(id); }
function deleteExpense(id){ state.expenses = state.expenses.filter(e=>e.id!==id); saveUserData(); render(); setToast('Expense deleted'); }
function saveExpenseModal(){
  const amt = Number(document.getElementById('m-amt').value)||0;
  const cat = document.getElementById('m-cat').value;
  const date = document.getElementById('m-date').value || new Date().toISOString().slice(0,10);
  const desc = document.getElementById('m-desc').value || '';
  if(state.modal.editId){
    const e = state.expenses.find(x=>x.id===state.modal.editId);
    Object.assign(e,{amt,cat,date,desc});
    setToast('Expense updated');
  } else {
    state.expenses.push({id:expenseIdSeq++, amt,cat,date,desc});
    setToast('Expense added');
  }
  state.modal=null;
  saveUserData();
  render();
}

function goalDetailCard(g){

  const monthsLeft = g.years*12;
  const reqSip = Math.round(requiredSip(g.amount, g.years, rate, g.saved));
  const projected = Math.round(sipFutureValue(reqSip, g.years, rate) + g.saved*Math.pow(1+rate/1200, monthsLeft));
  const shortfall = Math.max(0, g.amount-projected);
  return `<div class="card" style="margin-top:20px;">
    <div class="section-title">${g.name} — Plan Detail</div>
    <div class="rec-detail" style="grid-template-columns:repeat(4,1fr);margin-top:14px;">

      <div><b>Potential Shortfall${infoIcon('goal-shortfall')}</b>${shortfall>0?fmtShort(shortfall):'None'}</div>
    </div>
  </div>`;
}

/* ============================================================
   WHAT-IF SIMULATOR
   ============================================================ */
function simulatorPage(){
  const s = state.sim;
  const surplus = s.income - s.expenses;
  const rate = 10;
  const projected = Math.round(sipFutureValue(s.sip, s.years, rate));
  const target = state.goals[0].amount;
  const coverage = Math.max(5, Math.min(97, Math.round((projected/target)*80 + (surplus>10000?10:0))));
  const yearsToGoal = (Math.log((target*(rate/1200))/s.sip + 1) / Math.log(1+rate/1200) / 12).toFixed(1);

  return `
  <div class="page-head"><h1>What happens if your financial situation changes?</h1><p>Test decisions before you make them.</p></div>

  <div class="grid grid-2-1" style="margin-bottom:20px;">
    <div class="card">
      <div class="section-title">Scenario Controls</div>
      ${simSlider('Monthly Income','income',40000,100000,1000,s.income,fmt)}
      ${simSlider('Monthly Expenses','expenses',20000,60000,1000,s.expenses,fmt)}
      ${simSlider('Monthly SIP','sip',2000,25000,500,s.sip,fmt)}
      ${simSlider('Goal Timeline (years)','years',1,15,1,s.years,(v)=>v+' yrs')}
      <div class="section-sub" style="margin-top:18px;margin-bottom:6px;">Preset scenarios</div>
      <div class="chip-row">
        <div class="chip" onclick="applyPreset('salary')">Salary -10%</div>
        <div class="chip" onclick="applyPreset('expenses')">Expenses +₹5,000</div>
        <div class="chip" onclick="applyPreset('sip')">SIP +₹2,000</div>
        <div class="chip" onclick="applyPreset('goal')">Goal +1 Year</div>
        <div class="chip" onclick="resetSim()">Reset</div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Live Result</div>
      <div class="rec-detail" style="grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;">
        <div><b>Monthly Surplus${infoIcon('sim-surplus')}</b><span style="font-size:17px;font-family:'Space Grotesk';font-weight:700;">${fmt(surplus)}</span></div>
        <div><b>Projected Goal Coverage${infoIcon('sim-coverage')}</b><span style="font-size:17px;font-family:'Space Grotesk';font-weight:700;color:${coverage>60?'var(--primary)':'var(--amber)'};">${coverage}%</span></div>
        <div><b>Projected Goal Value${infoIcon('sim-projected')}</b><span style="font-size:17px;font-family:'Space Grotesk';font-weight:700;">${fmtShort(projected)}</span></div>
        <div><b>Goal Completion${infoIcon('sim-completion')}</b><span style="font-size:17px;font-family:'Space Grotesk';font-weight:700;">${isFinite(yearsToGoal)?yearsToGoal:'—'} yrs</span></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="section-title">Projected Growth</div>
    <div class="chart-box"><canvas id="chart-sim"></canvas></div>
  </div>

  ${state._simCompare? simCompareCard() : ''}
  `;
}
function simSlider(label, key, min, max, step, val, formatter){
  return `<div class="field">
    <label style="display:flex;justify-content:space-between;">${label}<span class="mono" style="color:var(--primary-dark);">${formatter(val)}</span></label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="updateSim('${key}', this.value)">
  </div>`;
}
function updateSim(key, val){
  const before = {...state.sim};
  state.sim[key] = Number(val);
  renderSimResultsOnly();
}
function renderSimResultsOnly(){ render(); }
function resetSim(){
  const u = state.user;
  state.sim = { income:u.income, expenses:u.essential+u.discretionary, sip:u.investment, years:state.goals[0].years };
  state._simCompare = null;
  render();
}
function applyPreset(kind){
  const before = {...state.sim};
  if(kind==='salary') state.sim.income = Math.round(state.sim.income*0.9);
  if(kind==='expenses') state.sim.expenses += 5000;
  if(kind==='sip') state.sim.sip += 2000;
  if(kind==='goal') state.sim.years += 1;
  state._simCompare = {before, after:{...state.sim}, kind};
  render();
}
function simCompareCard(){
  const c = state._simCompare;
  const rate=10;
  const beforeSip = Math.round(requiredSip(state.goals[0].amount, c.before.years, rate, state.goals[0].saved));
  const afterSip = Math.round(requiredSip(state.goals[0].amount, c.after.years, rate, state.goals[0].saved));
  const beforeStatus = 'On Track';
  const afterOnTrack = c.after.income - c.after.expenses >= afterSip;
  const afterStatus = afterOnTrack? 'On Track' : 'Slightly Off Track';
  return `<div class="card">
    <div class="section-title">Scenario Comparison</div>
    <div class="grid grid-2">
      <div class="card-soft">
        <div class="pill pill-blue" style="margin-bottom:10px;">Before</div>
        <div style="font-size:13.5px;margin-bottom:4px;">Income: <b>${fmt(c.before.income)}</b></div>
        <div style="font-size:13.5px;margin-bottom:4px;">SIP: <b>${fmt(state.user.investment)}</b></div>
        <div style="font-size:13.5px;">Goal: <b>${beforeStatus}</b></div>
      </div>
      <div class="card-soft" style="${afterOnTrack?'':'border-color:var(--amber);background:var(--amber-tint);'}">
        <div class="pill ${afterOnTrack?'pill-green':'pill-amber'}" style="margin-bottom:10px;">After</div>
        <div style="font-size:13.5px;margin-bottom:4px;">Income: <b>${fmt(c.after.income)}</b></div>
        <div style="font-size:13.5px;margin-bottom:4px;">Recommended SIP: <b>${fmt(afterSip)}</b></div>
        <div style="font-size:13.5px;">Goal: <b>${afterStatus}</b></div>
      </div>
    </div>
    <hr class="div">
    <div class="section-title" style="font-size:13.5px;">FinPilot Recommendation</div>
    <p style="font-size:13.5px;color:var(--ink-soft);margin-top:6px;">${afterOnTrack? "You're still on track under this scenario — no changes needed right now." : "Reduce discretionary spending by ₹2,500/month or extend your goal timeline by 6 months to stay on track."}</p>
  </div>`;
}

      <div class="modal calc-modal">
        <div class="modal-head"><h3>${d.title}</h3><button class="btn-ghost" onclick="closeCalcInfo();" aria-label="Close">${ICONS.close}</button></div>
        <div class="calc-block">
          <div class="calc-label">What it means</div>
          <p class="calc-text">${d.meaning}</p>
        </div>
        <div class="calc-block">
          <div class="calc-label">Inputs used</div>
          <div class="calc-inputs">${d.inputs.map(i=>`<div class="calc-input-row"><span>${i.label}</span><b>${i.value}</b></div>`).join('')}</div>
        </div>
        <div class="calc-block">
          <div class="calc-label">Calculation</div>
          <div class="calc-formula mono">${d.formula}</div>
          <div class="calc-math mono">${d.calc}</div>
        </div>
        <div class="calc-result">
          <div class="calc-label">Result</div>
          <div class="calc-result-value">${d.result}</div>
        </div>
        ${d.assumption?`<div class="calc-assumption"><b>Assumption:</b> ${d.assumption}</div>`:''}
      </div>
    </div>`;
  }
  return '';
}

/* ============================================================
   ASSISTANT
   ============================================================ */
function assistantHTML(){
  const showFab = !['landing','signup','login','onboarding'].includes(state.route);
  if(!showFab) return '';
  let panel='';
  if(state.assistOpen){
    panel = `<div class="assist-panel">
      <div class="assist-head"><b>Ask FinPilot</b><button class="btn-ghost" onclick="toggleAssist()">${ICONS.close}</button></div>
      <div class="assist-body" id="assist-body">
        ${state.assistMsgs.map(m=>`<div class="msg ${m.from}">${m.text}</div>`).join('')}
        ${state._assistShowActions? `<div class="assist-actions">
          <button class="btn btn-outline btn-sm" onclick="assistAction('increase')">Increase SIP</button>
          <button class="btn btn-outline btn-sm" onclick="assistAction('keep')">Keep Current Plan</button>
          <button class="btn btn-outline btn-sm" onclick="assistAction('simulate')">Simulate Both</button>
        </div>`:''}
      </div>
      <div style="padding:0 18px 10px;display:flex;gap:8px;flex-wrap:wrap;">
        <div class="quick-q" onclick="askAssistant('Can I increase my SIP by ₹2,000?')">Can I increase my SIP?</div>
        <div class="quick-q" onclick="askAssistant('Why is my health score 78?')">Why is my score 78?</div>
      </div>
      <div class="assist-foot">
        <input type="text" id="assist-input" placeholder="Ask about your finances…" onkeydown="if(event.key==='Enter'){sendAssistantInput();}">
        <button class="btn btn-primary btn-sm" onclick="sendAssistantInput()">Send</button>
      </div>
    </div>`;
  }
  return `${panel}<button class="fab" onclick="toggleAssist()">${ICONS.chat}Ask FinPilot</button>`;
}
function toggleAssist(){ state.assistOpen = !state.assistOpen; render(); }
function sendAssistantInput(){
  const inp = document.getElementById('assist-input');
  const text = inp.value.trim();
  if(!text) return;
  askAssistant(text);
}
function askAssistant(text){
  state.assistMsgs.push({from:'user', text});
  const u = state.user;
  let reply, showActions=false;
  const lower = text.toLowerCase();
  if(lower.includes('sip') && lower.includes('increase')){
    reply = `Based on your current income of ${fmt(u.income)}, expenses of ${fmt(u.essential+u.discretionary)}, and existing goal, increasing your SIP to ₹11,000 is possible. However, your emergency savings contribution would decrease.`;
    showActions = true;
  } else if(lower.includes('score')){
    reply = `Your Financial Health Score of ${healthScore(u)}/100 reflects your savings rate, whether you're investing consistently, and your emergency fund coverage. Your savings rate is the biggest driver right now.`;
  } else if(lower.includes('goal')){
    const g = state.goals[0];
    reply = `Your primary goal is ${fmt(g.amount)} in ${g.years} years. You've saved ${fmt(g.saved)} so far — that's ${Math.round(g.saved/g.amount*100)}% of the way there.`;
  } else if(lower.includes('budget')){
    reply = `Your budget allocates ${fmt(u.essential)} to essentials, ${fmt(u.discretionary)} to discretionary spending, ${fmt(u.emergency)} to emergency savings, and ${fmt(u.investment)} to investments each month.`;
  } else {
    reply = `I can walk you through your income, expenses, budget, goals, or investment plan — try asking about one of those, or tap a suggestion below.`;
  }
  state.assistMsgs.push({from:'bot', text:reply});
  state._assistShowActions = showActions;
  render();
  const inp = document.getElementById('assist-input');
  if(inp) inp.value='';
  const body = document.getElementById('assist-body');
  if(body) body.scrollTop = body.scrollHeight;
}
function assistAction(kind){
  let reply;
  if(kind==='increase'){ state.user.investment = 11000; reply='Done — your SIP is now ₹11,000/month. Your emergency contribution has been adjusted down slightly to keep your budget balanced.'; }
  else if(kind==='keep'){ reply='No changes made — your plan stays as it is.'; }
  else { nav('simulator'); reply='Opening the What-If Simulator so you can compare both paths side by side.'; }
  state.assistMsgs.push({from:'bot', text:reply});
  state._assistShowActions=false;
  render();
}

/* ============================================================
   MOBILE NAV OVERLAY
   ============================================================ */
function mobileNavHTML(){
  if(!state.mobileNavOpen) return '';
  const items = [
    {r:'dashboard', label:'Dashboard'},{r:'expenses', label:'Expenses'},{r:'budget', label:'Budget'},
    {r:'goals', label:'Goals'},{r:'investments', label:'Investments'},{r:'simulator', label:'Simulator'},
    {r:'learn', label:'Learn'},{r:'plan', label:'Financial Health'},{r:'profile', label:'Profile'},
  ];
  return `<div class="mobile-nav">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <span style="font-family:'Space Grotesk';font-weight:700;font-size:18px;">FinPilot</span>
      <button class="btn-ghost" onclick="toggleMobileNav()">${ICONS.close}</button>
    </div>
    ${items.map(it=>`<div class="nav-item ${state.route===it.r?'active':''}" style="font-size:16px;padding:14px 12px;" onclick="nav('${it.r}')">${it.label}</div>`).join('')}
  </div>`;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
const APP_PAGES = {
  dashboard: {render:dashboardPage, title:'Dashboard'},
  expenses: {render:expensesPage, title:'Expenses'},
  budget: {render:budgetPage, title:'Budget'},
  goals: {render:goalsPage, title:'Goals'},
  investments: {render:investmentsPage, title:'Investments'},
  simulator: {render:simulatorPage, title:'Simulator'},
  learn: {render:learnPage, title:'Learn'},
  plan: {render:planPage, title:'Financial Plan'},
  profile: {render:profilePage, title:'Profile'},
  settings: {render:settingsPage, title:'Settings'},
};

function render(){
  const root = document.getElementById('root');
  let html='';

  if(isProtectedRoute(state.route) && !state.authed){
    state.route = 'login';
  }

  if(state.route==='landing' || state.route==='learn-preview'){
    html = landingPage();
  } else if(state.route==='signup'){
    html = signupPage();
  } else if(state.route==='login'){
    html = loginPage();
  } else if(state.route==='onboarding'){
    html = onboardingPage();
  } else if(APP_PAGES[state.route]){
    html = `<div id="app-shell">
      <div class="sidebar">${sidebarHTML()}</div>
      <div class="main">
        ${topbarHTML(APP_PAGES[state.route].title)}
        <div class="page">${APP_PAGES[state.route].render()}</div>
      </div>
    </div>`;
  } else {
    html = landingPage();
  }

  html += modalHTML();
  html += assistantHTML();
  html += mobileNavHTML();
  if(state.toast) html += `<div class="toast">${state.toast}</div>`;

  root.innerHTML = html;
  drawCharts();
}

/* ============================================================
   CHART DRAWING
   ============================================================ */
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
function drawCharts(){
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.color = '#5B6B82';

  if(document.getElementById('mini-cashflow')){
    destroyChart('mini-cashflow');
    charts['mini-cashflow'] = new Chart(document.getElementById('mini-cashflow'), {
      type:'line',
      data:{ labels:['Apr','May','Jun','Jul','Aug','Sep'],
        datasets:[
          {label:'Income', data:[58000,58000,59000,60000,60000,60000], borderColor:'#2E5AA8', backgroundColor:'transparent', tension:.35, pointRadius:0, borderWidth:2},
          {label:'Expenses', data:[33000,36000,34000,37000,35000,35000], borderColor:'#0E6E5B', backgroundColor:'transparent', tension:.35, pointRadius:0, borderWidth:2},
        ]},
      options:{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{display:false}}, maintainAspectRatio:false}
    });
  }

  if(document.getElementById('chart-cashflow')){
    destroyChart('chart-cashflow');
    charts['chart-cashflow'] = new Chart(document.getElementById('chart-cashflow'), {
      type:'line',
      data:{ labels:['Apr','May','Jun','Jul','Aug','Sep'],
        datasets:[
          {label:'Income', data:[58000,58000,59000,60000,60000,60000], borderColor:'#2E5AA8', backgroundColor:'rgba(46,90,168,0.06)', tension:.35, pointRadius:3, borderWidth:2, fill:true},
          {label:'Expenses', data:[33000,36000,34000,37000,35000,35000], borderColor:'#0E6E5B', backgroundColor:'rgba(14,110,91,0.07)', tension:.35, pointRadius:3, borderWidth:2, fill:true},
        ]},
      options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10, usePointStyle:true}}},
        scales:{x:{grid:{display:false}}, y:{grid:{color:'#EEF2F6'}, ticks:{callback:v=>fmtShort(v)}}}, maintainAspectRatio:false}
    });
  }

  if(document.getElementById('chart-health')){
    destroyChart('chart-health');
    const score = healthScore(state.user);
    charts['chart-health'] = new Chart(document.getElementById('chart-health'), {
      type:'doughnut',
      data:{ datasets:[{data:[score,100-score], backgroundColor:['#0E6E5B','#EEF2F6'], borderWidth:0}]},
      options:{cutout:'78%', plugins:{legend:{display:false}, tooltip:{enabled:false}}, maintainAspectRatio:false}
    });
  }

  if(document.getElementById('chart-spend-donut')){
    destroyChart('chart-spend-donut');
    const byCat = {};
    state.expenses.forEach(e=>{ byCat[e.cat]=(byCat[e.cat]||0)+e.amt; });
    const labels = Object.keys(byCat);
    charts['chart-spend-donut'] = new Chart(document.getElementById('chart-spend-donut'), {
      type:'doughnut',
      data:{labels, datasets:[{data:labels.map(l=>byCat[l]), backgroundColor:labels.map(l=>CATS[l].color), borderWidth:2, borderColor:'#fff'}]},
      options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10, usePointStyle:true, font:{size:11}}}}, maintainAspectRatio:false}
    });
  }

  if(document.getElementById('chart-exp-trend')){
    destroyChart('chart-exp-trend');
    charts['chart-exp-trend'] = new Chart(document.getElementById('chart-exp-trend'), {
      type:'bar',
      data:{labels:['Week 1','Week 2','Week 3','Week 4'], datasets:[{data:[8200,7400,10300,9100], backgroundColor:'#0E6E5B', borderRadius:6, maxBarThickness:44}]},
      options:{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grid:{color:'#EEF2F6'}, ticks:{callback:v=>fmtShort(v)}}}, maintainAspectRatio:false}
    });
  }

  if(document.getElementById('chart-budget-donut')){
    destroyChart('chart-budget-donut');
    const u = state.user;
    const disc = state._budgetOptimized?10000:u.discretionary;
    const inv = state._budgetOptimized?10000:u.investment;
    const rem = Math.max(0, u.income-u.essential-disc-u.emergency-inv);
    charts['chart-budget-donut'] = new Chart(document.getElementById('chart-budget-donut'), {
      type:'doughnut',
      data:{labels:['Essential','Discretionary','Emergency','Investments','Remaining'],
        datasets:[{data:[u.essential,disc,u.emergency,inv,rem], backgroundColor:['#0B1F3A','#A8702E','#2E5AA8','#0E6E5B','#E4E9F0'], borderWidth:2, borderColor:'#fff'}]},
      options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10, usePointStyle:true, font:{size:11}}}}, maintainAspectRatio:false}
    });
  }

  if(document.getElementById('chart-sip-projection')){
    destroyChart('chart-sip-projection');
    const g = state.goals[0]; const rate=10;
    const labels=[]; const data=[];
    for(let y=1;y<=g.years;y++){ labels.push('Year '+y); data.push(Math.round(sipFutureValue(Math.round(requiredSip(g.amount,g.years,rate,g.saved)), y, rate)+g.saved)); }
    charts['chart-sip-projection'] = new Chart(document.getElementById('chart-sip-projection'), {
      type:'line',
      data:{labels, datasets:[
        {label:'Projected Value', data, borderColor:'#0E6E5B', backgroundColor:'rgba(14,110,91,0.08)', fill:true, tension:.3, pointRadius:4, borderWidth:2},
        {label:'Goal', data:labels.map(()=>g.amount), borderColor:'#B23B3B', borderDash:[6,5], pointRadius:0, borderWidth:1.5}
      ]},
      options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10, usePointStyle:true}}}, scales:{y:{ticks:{callback:v=>fmtShort(v)}, grid:{color:'#EEF2F6'}}, x:{grid:{display:false}}}, maintainAspectRatio:false}
    });
  }

  if(document.getElementById('chart-sim')){
    destroyChart('chart-sim');
    const s = state.sim; const rate=10;
    const labels=[]; const data=[];
    for(let y=1;y<=s.years;y++){ labels.push('Year '+y); data.push(Math.round(sipFutureValue(s.sip,y,rate))); }
    charts['chart-sim'] = new Chart(document.getElementById('chart-sim'), {
      type:'line',
      data:{labels, datasets:[{label:'Projected Value', data, borderColor:'#2E5AA8', backgroundColor:'rgba(46,90,168,0.08)', fill:true, tension:.3, pointRadius:4, borderWidth:2}]},
      options:{plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>fmtShort(v)}, grid:{color:'#EEF2F6'}}, x:{grid:{display:false}}}, maintainAspectRatio:false}
    });
  }
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && state.modal){
    state.modal = null;
    render();
  }
});

/* Guard against the browser restoring a stale (e.g. logged-out) DOM
   from bfcache when navigating back/forward. */
window.addEventListener('pageshow', function(e){
  if(e.persisted){
    initAuth();
    render();
  }
});

initAuth();
render();
</script>

</html>
